<style>
:root{
  --primary:#2563eb;
  --primary-d:#1d4ed8;
  --primary-light:#dbeafe;
  --bg:#f4f6fb;
  --card:#ffffff;
  --text:#111827;
  --text‑muted:#4b5563;
  --muted:#64748b;
  --line:#e2e8f0;
  --ok:#16a34a;
  --ok‑light:#f0fdf4;
  --bad:#dc2626;
  --bad‑light:#fef2f2;
  --warn:#d97706;
  --warn‑light:#fffbeb;
  --radius:18px;
  --radius‑sm:12px;
  --shadow:0 4px 16px rgba(37, 99, 235, 0.09);
  --shadow‑soft:0 2px 8px rgba(15,23,42,.06);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  background:var(--bg);
  color:var(--text);
  line-height:1.6;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));
}
#app{max-width:720px;margin:0 auto;min-height:100vh;}
header.top{
  background:linear-gradient(135deg,#2563eb,#3b82f6);
  color:#fff;
  padding:20px 18px 16px;
  position:sticky;
  top:0;
  z-index:20;
  box-shadow:0 4px 12px rgba(37,99,235,.22);
}
header.top h1{font-size:19px;font-weight:700;letter-spacing:0.3px}
header.top p{font-size:13px;opacity:.9;margin-top:4px}
nav.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:var(--card);
  border-top:1px solid var(--line);
  display:flex;
  z-index:20;
  max-width:720px;
  margin:0 auto;
  padding-bottom:env(safe-area-inset-bottom);
}
nav.bottom button{
  flex:1;
  border:0;
  background:none;
  padding:10px 0 10px;
  font-size:12px;
  color:var(--muted);
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
  cursor:pointer;
  transition:0.18s;
}
nav.bottom button .ico{font-size:21px}
nav.bottom button.active{color:var(--primary);font-weight:600}

.view{padding:16px}
.card{
  background:var(--card);
  border-radius:var(--radius);
  box-shadow:var(--shadow‑soft);
  padding:18px;
  margin-bottom:16px;
  overflow:hidden;
}
.card h2{
  font-size:16px;
  margin-bottom:14px;
  display:flex;
  align-items:center;
  gap:7px;
  font-weight:600;
}
.muted{color:var(--muted);font-size:13.5px}
.row{display:flex;gap:11px;flex-wrap:wrap;align-items:center}

.btn{
  border:0;
  border-radius:var(--radius‑sm);
  padding:12px 18px;
  font-size:14.5px;
  font-weight:600;
  cursor:pointer;
  background:var(--primary);
  color:#fff;
  transition: all .18s ease;
}
.btn:active{transform:scale(.965)}
.btn.ghost{background:#eff6ff;color:var(--primary)}
.btn.danger{background:var(--bad‑light);color:var(--bad)}
.btn.sm{padding:8px 13px;font-size:13px;border-radius:10px}
.btn.block{width:100%;margin-top:12px}

select,input[type=text]{
  width:100%;
  padding:13px 14px;
  border:1px solid var(--line);
  border-radius:var(--radius‑sm);
  font-size:16px;
  background:#fff;
  color:var(--text);
  outline:none;
  transition:0.18s;
}
select:focus,input:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 3px rgba(37, 99, 235, 0.12);
}
label.field{display:block;margin-bottom:14px;font-size:13.5px;color:var(--text‑muted)}
label.field>select{margin-top:6px}

.seg{
  display:flex;
  background:#eff6ff;
  border-radius:var(--radius‑sm);
  padding:5px;
  gap:5px;
}
.seg button{
  flex:1;
  border:0;
  background:none;
  padding:10px;
  border-radius:9px;
  font-size:13.5px;
  color:var(--muted);
  cursor:pointer;
  transition:0.18s;
}
.seg button.active{
  background:#fff;
  color:var(--primary);
  font-weight:600;
  box-shadow:0 2px 6px rgba(0,0,0,.07);
}
.seg.compact button{font-size:12.5px;padding:9px 5px;white-space:normal;line-height:1.4}

.stats-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}
.stat{
  background:linear-gradient(145deg,#ffffff,#f8faff);
  border-radius:var(--radius‑sm);
  padding:14px 8px;
  text-align:center;
  box-shadow:var(--shadow‑soft);
}
.stat .num{font-size:22px;font-weight:700;color:var(--primary)}
.stat .lbl{font-size:11.5px;color:var(--muted);margin-top:4px}

.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px}
.pill.ok{background:var(--ok‑light);color:var(--ok)}
.pill.bad{background:var(--bad‑light);color:var(--bad)}
.pill.warn{background:var(--warn‑light);color:var(--warn)}
.pill.gray{background:#f1f5f9;color:var(--muted)}

.quiz-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;font-size:13.5px;color:var(--muted)}
.progress{height:9px;background:#e8edf6;border-radius:99px;overflow:hidden;margin-bottom:20px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,#2563eb,#3b82f6);border-radius:99px;transition:width .28s}

.prompt{text-align:center;padding:12px 0 20px}
.prompt .zh{font-size:26px;font-weight:700;margin-bottom:8px}
.prompt .pos{font-size:13.5px;color:var(--muted)}
.prompt .coll{font-size:13.5px;color:var(--muted);margin-top:10px}
.prompt .en{font-size:28px;font-weight:700;letter-spacing:.6px}

.speak{
  border:1px solid var(--line);
  background:#fff;
  border-radius:var(--radius‑sm);
  padding:10px 16px;
  font-size:15.5px;
  cursor:pointer;
  margin-top:12px;
  color:var(--primary);
  transition:0.18s;
}
.speak:active{background:#eff6ff}

.answer-box{margin-top:18px}
.answer-box input{font-size:19px;text-align:center;letter-spacing:1.2px;padding:14px}

.quiz-options{display:grid;gap:12px;margin-top:18px}
.opt{
  border:1px solid var(--line);
  background:#fff;
  border-radius:var(--radius‑sm);
  padding:15px 17px;
  font-size:16.5px;
  cursor:pointer;
  text-align:left;
  transition:0.18s;
}
.opt:hover{border-color:var(--primary-light);background:#f8faff}
.opt.correct{background:var(--ok‑light);border-color:var(--ok);color:var(--ok);font-weight:600}
.opt.wrong{background:var(--bad‑light);border-color:var(--bad);color:var(--bad)}
.opt:disabled{cursor:default;opacity:.94}

.feedback{margin-top:16px;padding:14px;border-radius:var(--radius‑sm);font-size:14.5px}
.feedback.ok{background:var(--ok‑light);color:var(--ok)}
.feedback.bad{background:var(--bad‑light);color:var(--bad)}
.feedback .ans{font-weight:700;margin-top:6px}

.word-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:13px 0;
  border-bottom:1px solid var(--line);
  gap:12px;
}
.word-row:last-child{border-bottom:0}
.word-row .main{flex:1;min-width:0}
.word-row .en{font-weight:600;font-size:15px}
.word-row .meta{font-size:12.5px;color:var(--muted);margin-top:3px}
.tag{font-size:11.5px;padding:2px 8px;border-radius:7px;margin-left:7px}
.tag.star{background:var(--warn‑light);color:var(--warn)}

.day-item{
  border:1px solid var(--line);
  border-radius:var(--radius‑sm);
  margin-bottom:12px;
  overflow:hidden;
  background:#fff;
}
.day-item>button{
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 16px;
  background:#fff;
  border:0;
  font-size:14.5px;
  cursor:pointer;
  transition:0.15s;
}
.day-item>button:active{background:#f8faff}
.day-item .body{padding:0 16px 10px;display:none}
.day-item.open .body{display:block}

.heat{display:grid;grid-template-columns:repeat(10,1fr);gap:7px;margin-top:12px}
.heat div{
  aspect-ratio:1;
  border-radius:7px;
  background:#eef2f7;
  font-size:10.5px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--muted);
}
.heat div.done{background:#dbeafe;color:var(--primary‑d)}
.heat div.master{background:#bbf7d0;color:var(--ok)}
.heat div.hasbad{background:#fecaca;color:var(--bad)}

.record-item{padding:14px 0;border-bottom:1px solid var(--line)}
.record-item:last-child{border-bottom:0}
.record-item .top{display:flex;justify-content:space-between;font-size:14.5px}
.record-item .sub{font-size:12.5px;color:var(--muted);margin-top:4px}
details.badwords{margin-top:10px}
details.badwords summary{cursor:pointer;font-size:13.5px;color:var(--bad)}

.empty{text-align:center;padding:44px 12px;color:var(--muted)}
.empty .big{font-size:44px;margin-bottom:10px}

.toggle{display:flex;align-items:center;gap:9px;font-size:13.5px;color:var(--muted);margin:10px 0}
.switch{
  position:relative;
  width:42px;
  height:23px;
  background:#cbd5e1;
  border-radius:99px;
  cursor:pointer;
  transition:.22s
}
.switch.on{background:var(--primary)}
.switch::after{
  content:"";
  position:absolute;
  top:3px;
  left:3px;
  width:17px;
  height:17px;
  background:#fff;
  border-radius:50%;
  transition:.22s
}
.switch.on::after{left:22px}
.badge-count{
  background:var(--bad);
  color:#fff;
  border-radius:99px;
  font-size:10.5px;
  padding:1px 6px;
  margin-left:5px;
}
</style>
</head>
